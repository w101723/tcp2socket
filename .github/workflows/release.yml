name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          TCP2SOCKET_TEST_RACE=1 go test -race -timeout 180s ./...

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >-
          go build -trimpath -ldflags="-s -w"
          -o dist/tcp2socket-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: tcp2socket-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/tcp2socket-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set release timestamp
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: echo "TAG=$(date -u +'%Y%m%d%H%M%S')-${COMMIT_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum tcp2socket-* > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$COMMIT_SHA" \
            --title "$TAG" \
            --notes "Automated build for commit $COMMIT_SHA. Verify downloads using SHA256SUMS."
